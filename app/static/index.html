<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b0e13" />
    <title>NUTPulse</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-overview" viewBox="0 0 24 24">
        <rect x="2.75" y="3.5" width="18.5" height="14" rx="2.25" />
        <path d="M6 11.5h2.4l1.8-4.1 3.2 8.1 2.1-4h2.5M8.5 21h7M12 17.5V21" />
      </symbol>
      <symbol id="icon-history" viewBox="0 0 24 24">
        <circle cx="9.5" cy="9.5" r="6.5" />
        <path d="M9.5 6v4l2.7 1.7M14.5 20l2.6-3 2.1 1.8L22 14.5M17.5 20H22v-4.5" />
      </symbol>
      <symbol id="icon-devices" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="7" rx="1.5" />
        <rect x="3" y="14" width="18" height="7" rx="1.5" />
        <path d="M7 6.5h.01M10 6.5h7M7 17.5h.01M10 17.5h7" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path d="M3 6h4M11 6h10M3 12h10M17 12h4M3 18h2M9 18h12" />
        <circle cx="9" cy="6" r="2" />
        <circle cx="15" cy="12" r="2" />
        <circle cx="7" cy="18" r="2" />
      </symbol>
      <symbol id="icon-power" viewBox="0 0 24 24">
        <path d="M12 2v10M18.4 5.6a9 9 0 1 1-12.8 0" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" />
      </symbol>
      <symbol id="icon-gauge" viewBox="0 0 24 24">
        <path d="M4.9 19.1a9 9 0 1 1 14.2 0M12 13l4-4M7.5 16.5h.01M16.5 16.5h.01" />
      </symbol>
      <symbol id="icon-zap" viewBox="0 0 24 24">
        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z" />
      </symbol>
      <symbol id="icon-plug-input" viewBox="0 0 24 24">
        <path d="M7 2v5M13 2v5M5 7h10v3a5 5 0 0 1-5 5v5M17 14v7M14 18l3 3 3-3" />
      </symbol>
      <symbol id="icon-plug-output" viewBox="0 0 24 24">
        <path d="M7 2v5M13 2v5M5 7h10v3a5 5 0 0 1-5 5v5M17 21v-7M14 17l3-3 3 3" />
      </symbol>
      <symbol id="icon-coins" viewBox="0 0 24 24">
        <ellipse cx="9" cy="6" rx="6" ry="3" /><path d="M3 6v4c0 1.7 2.7 3 6 3s6-1.3 6-3V6M3 10v4c0 1.7 2.7 3 6 3 1.1 0 2.1-.1 3-.4M3 14v4c0 1.7 2.7 3 6 3 1.2 0 2.3-.2 3.2-.5" /><path d="M15 13.5c3.3 0 6 1.3 6 3s-2.7 3-6 3-6-1.3-6-3" />
      </symbol>
      <symbol id="icon-arrow-right" viewBox="0 0 24 24">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </symbol>
      <symbol id="icon-battery" viewBox="0 0 24 24">
        <rect x="2" y="6" width="18" height="12" rx="2" /><path d="M22 10v4M6 10v4M10 10v4M14 10v4" />
      </symbol>
      <symbol id="icon-list-tree" viewBox="0 0 24 24">
        <path d="M3 4h.01M3 10h.01M3 16h.01M7 4h14M7 10h10M7 16h14" /><path d="M17 8l2 2-2 2" />
      </symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12M7 10l5 5 5-5M4 21h16" />
      </symbol>
      <symbol id="icon-triangle-alert" viewBox="0 0 24 24">
        <path d="M10.3 3.8 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01" />
      </symbol>
      <symbol id="icon-circle-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" /><path d="m8 12 2.7 2.7L16.5 9" />
      </symbol>
      <symbol id="icon-chart-line" viewBox="0 0 24 24">
        <path d="M3 3v18h18M7 16l4-5 3 3 5-7" />
      </symbol>
      <symbol id="icon-history-list" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2" />
      </symbol>
      <symbol id="icon-activity" viewBox="0 0 24 24">
        <path d="M3 12h4l2-7 4 14 2-7h6" />
      </symbol>
      <symbol id="icon-server" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="7" rx="2" /><rect x="3" y="14" width="18" height="7" rx="2" /><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6" />
      </symbol>
      <symbol id="icon-plug" viewBox="0 0 24 24">
        <path d="M8 2v6M16 2v6M6 8h12v3a6 6 0 0 1-6 6v5" />
      </symbol>
      <symbol id="icon-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" />
      </symbol>
      <symbol id="icon-file-chart" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z" /><path d="M14 2v6h6M8 17v-3M12 17v-6M16 17v-2" />
      </symbol>
      <symbol id="icon-inbox" viewBox="0 0 24 24">
        <path d="M4 4h16l2 10v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5L4 4Z" /><path d="M2 14h5l2 3h6l2-3h5" />
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4 20-7Z" /><path d="M22 2 11 13" />
      </symbol>
      <symbol id="icon-save" viewBox="0 0 24 24">
        <path d="M4 3h13l3 3v15H4V3Z" /><path d="M8 3v6h8V3M8 21v-7h8v7" />
      </symbol>
    </svg>
    <div id="login-view" class="login-view hidden">
      <form id="login-form" class="login-card">
        <div class="brand-mark large"><svg class="brand-icon"><use href="#icon-power" /></svg></div>
        <h1>NUTPulse</h1>
        <p>Sign in to monitor your UPS devices.</p>
        <label>Username<input id="login-username" autocomplete="username" required /></label>
        <label>Password<input id="login-password" type="password" autocomplete="current-password" required /></label>
        <div id="login-error" class="form-error"></div>
        <button class="button primary full" type="submit">Log in</button>
      </form>
    </div>

    <div id="app-shell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark"><svg class="brand-icon"><use href="#icon-power" /></svg></span><span>NUTPulse</span></div>
        <nav>
          <button class="nav-item active" data-page="overview"><span class="nav-icon-wrap"><svg class="nav-icon"><use href="#icon-overview" /></svg></span>Overview</button>
          <button class="nav-item" data-page="history"><span class="nav-icon-wrap"><svg class="nav-icon"><use href="#icon-history" /></svg></span>History</button>
          <button class="nav-item" data-page="devices"><span class="nav-icon-wrap"><svg class="nav-icon"><use href="#icon-devices" /></svg></span>Devices</button>
          <button class="nav-item" data-page="settings"><span class="nav-icon-wrap"><svg class="nav-icon"><use href="#icon-settings" /></svg></span>Settings</button>
        </nav>
        <div class="sidebar-footer">
          <div id="connection-indicator" class="connection-pill"><i></i><span>Connecting</span></div>
          <button id="logout-button" class="text-button">Log out</button>
        </div>
      </aside>
      <main id="main-content" class="main-content" aria-live="polite"></main>
      <nav class="mobile-nav">
        <button class="active" data-page="overview"><svg class="nav-icon"><use href="#icon-overview" /></svg><span>Overview</span></button>
        <button data-page="history"><svg class="nav-icon"><use href="#icon-history" /></svg><span>History</span></button>
        <button data-page="devices"><svg class="nav-icon"><use href="#icon-devices" /></svg><span>Devices</span></button>
        <button data-page="settings"><svg class="nav-icon"><use href="#icon-settings" /></svg><span>Settings</span></button>
      </nav>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
