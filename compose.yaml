name: nutpulse

services:
  nutpulse:
    build:
      context: .
    image: nutpulse:local
    container_name: nutpulse
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Bucharest}
      NUT_HOST: ${NUT_HOST:-nut-server}
      NUT_SERVER_NAME: ${NUT_SERVER_NAME:-NUT Server}
      NUT_PORT: ${NUT_PORT:-3493}
      NUT_POLL_INTERVAL: ${NUT_POLL_INTERVAL:-10}
      ENERGY_PRICE: ${ENERGY_PRICE:-1.20}
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - nutpulse_data:/data
    ports:
      - "127.0.0.1:${WEB_PORT:-9001}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)); raise SystemExit(0 if d.get('status') in ('ok','degraded') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  nutpulse_data:
    name: nutpulse_data
